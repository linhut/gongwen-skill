template_name: 通报
document_type: bulletin

check_rules:
  - id: CHK-BT001
    name: 通报事实检查
    severity: P1
    field: content.facts
    expected: 事实清楚
    message: 通报应事实清楚、表述准确
    category: content

  - id: CHK-BT002
    name: 通报目的检查
    severity: P2
    field: content.purpose
    expected: 明确通报目的
    message: 通报应明确表彰、批评或传达的目的
    category: content

  - id: CHK-BT003
    name: 通报标题格式检查
    severity: P2
    field: title.pattern
    expected: 包含"通报"字样
    message: 通报标题应包含"关于……的通报"格式
    category: format

fix_rules: []
