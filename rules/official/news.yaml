name: news
display: 新闻稿/简报
description: 报道会议、活动、工作进展等新闻事实的文稿

# ===== 范文学习来源 =====
# 范文1：筹委会市场开发部第一次全体会议（微信公众号"湖南民宗"）
#   标题：部门名+序次+会议类型+召开
#   强调=部署，要求=督办
# 范文2：筹委会办公室人工智能赋能信息技术工作专题部署会议
#   标题：XX工作+会议类型+在XX召开
#   强调=问题，要求=部署

title:
  style: event_statement  # 事件陈述式，非事由+文种式
  max_length: 35
  # 标题模式（两种，按会议类型选择）
  patterns:
    - name: 专题会议式
      template: "{部门/工作}+{会议类型}+在{地点}+召开"
      example: "筹委会办公室人工智能赋能信息技术工作专题部署会议在长沙召开"
      applicable: 专题部署会、工作推进会等特定主题会议
    - name: 常规会议式
      template: "{机构}+{部门}+第{序次}次+{会议类型}+召开"
      example: "第十三届全国少数民族传统体育运动会筹委会市场开发部第一次全体会议召开"
      applicable: 全体会议、例行会议、部门会议
  # 地点是否入标题：专题会议式必含地点；常规会议式可不含

structure:
  - name: 导语段
    required: true
    keywords: ["召开", "在", "会议", "今天"]
    elements: [日期, 地点, 会议全称, 简称定义, 主持领导(职务+姓名+动作), 参会单位]
    rules:
      - 会议全称首次出现时须定义简称（"以下简称'XX'"）
      - 主持领导写全衔（单位+职务+姓名）
      - 参会单位按党→政→群→企排序

  - name: 听取/通报段
    required: true
    keywords: ["听取了", "通报了", "汇报了", "汇报"]
    # 两种详略模式
    modes:
      - name: 详写式
        elements: [汇报人职务+姓名, 汇报主题, 汇报单位]
        example: "会议听取了……副部长钟扬关于……课题推进情况的通报"
        applicable: 汇报内容为核心议题，需明确汇报责任人
      - name: 略写式
        elements: [汇报方, 汇报主题]
        example: "会议听取了综合协调部、市场开发部关于……的汇报"
        applicable: 常规汇报，汇报人非核心焦点

  - name: 指出/肯定段
    required: false
    keywords: ["会议指出", "会议认为", "会议充分肯定", "指出", "认为"]
    elements: [成绩/意义, 号召]
    # 两种写法
    patterns:
      - name: 排比定性式
        template: "XX是……的XX，是……的XX"
        example: "是彰显办赛特色的重要载体，是服务全省大局的战略举措"
      - name: 号召收尾式
        template: "定性评价+引号口号/号召"
        example: "以'开局就是决战，起步就要冲刺'的姿态，全身心投入"

  - name: 强调段
    required: false
    keywords: ["会议强调", "强调"]
    # 两种逻辑模式
    modes:
      - name: 问题导向式
        logic: "指出问题→分析原因→提出方向"
        elements: [问题, 原因, 破解方向]
        example: "会议强调，要清醒认识当前存在的困难挑战……"
      - name: 部署导向式
        logic: "提高认识→明确任务→具体举措"
        elements: [认识要求, 目标任务, 具体举措]
        example: "会议强调，要提高站位认识……要聚焦核心目标……"

  - name: 要求段
    required: false
    keywords: ["会议要求", "要求"]
    # 与强调段形成配套
    modes:
      - name: 部署式（配套问题导向强调段）
        elements: [推进措施, 协同要求, 落实保障]
        example: "会议要求，要全力推动课题建设落地见效……"
      - name: 督办式（配套部署导向强调段）
        elements: [协同机制, 监督评估, 考核保障]
        example: "会议要求，要深化协同联动……要建立健全监督评估机制……"

  - name: 稿源/编辑信息
    required: true
    keywords: ["稿源", "编辑"]
    elements: [稿源单位, 编辑姓名]
    example: "稿源：省民宗委共同发展处  编辑：XXX"

# 新闻稿不需要的法定公文检查项
# P3-7：skip_checks 为声明性文档配置（供 Agent 审阅参考），focus_checks 由
# auto_optimizer/focus_checker 实际消费；skip_checks 暂无程序化消费方，保留作为说明
skip_checks:
  - 主送机关缺失
  - 落款缺失
  - 附件说明格式
  - 标题文种标识
  - 结尾规范语
  - 标题字数严格限制

# 新闻稿重点检查项
focus_checks:
  - 人名/职务/机构名准确性
  - 时间一致性
  - 逻辑闭环（听取→指出→强调→要求）
  - 事实表述客观克制
  - 稿源/编辑信息完整性
  - 简称定义规范（首次出现时定义）
