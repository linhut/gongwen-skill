  - id: FIX-C013b
    ref_check: CHK-C046
    action: set_size
    target: signature
    value: 18pt

  - id: FIX-C041
    ref_check: CHK-C041
    action: fix_paragraph_type
    target: salutation
    value:
      alignment: left
      first_line_indent: 0
      bold: false

  - id: FIX-C042
    ref_check: CHK-C042
    action: fix_paragraph_type
    target: introduction
    value:
      alignment: justify
      first_line_indent: 2em
      bold: false

  - id: FIX-C043
