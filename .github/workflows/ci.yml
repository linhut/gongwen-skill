name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests with coverage
        if: hashFiles('tests/**') != ''
        run: pytest tests/ -v --tb=short --cov=gongwen --cov=engine --cov-report=term-missing --cov-fail-under=20
      - name: Skip notice (tests not synced)
        if: hashFiles('tests/**') == ''
        run: echo "tests/ not present (local-only per release policy); skipping test job"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install lint tools
        run: pip install pycodestyle
      - name: Check Python style
        run: pycodestyle --max-line-length=120 --exclude=__pycache__,.git,dist,build .

  doctor:
    name: Self-Diagnosis
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install fonts (simulate user install path)
        run: python -m gongwen font install
      - name: Run doctor self-diagnosis
        run: |
          python -m gongwen doctor --json 2>&1 | python -c "
          import sys, json
          d = json.load(sys.stdin)
          print(f'Total: {d[\"summary\"][\"total\"]}, OK: {d[\"summary\"][\"ok\"]}, FAIL: {d[\"summary\"][\"failed\"]}')
          if d['summary']['failed'] > 0:
              for c in d['checks']:
                  if not c['ok']:
                      print(f'  FAIL: {c[\"name\"]} - {c.get(\"detail\", \"\")}')
              sys.exit(1)
          print('All checks passed')
          "

  publish:
    name: Publish to PyPI
    needs: [test, lint, doctor]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: [test, lint, doctor]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # npm Trusted Publishing (OIDC) 必需
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # 不要配 registry-url：它会向 .npmrc 写入 _authToken=${NODE_AUTH_TOKEN}
          # 并注入占位值 XXXXX-XXXXX-XXXXX-XXXXX，npm 会把它当成真实 token，
          # 从而跳过 OIDC 交换，最终以 E404 失败。npm 默认源即 registry.npmjs.org。
      - name: Upgrade npm CLI for Trusted Publishing
        # OIDC 凭证交换要求 npm CLI >= 11.5.1、Node >= 22.14.0
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - name: Verify OIDC prerequisites
        run: |
          echo "OIDC id-token available: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes}"
          echo "npm version: $(npm --version)"
          echo "npm registry: $(npm config get registry)"
      - name: Inspect OIDC identity claims
        # 诊断用：打印 npm 侧 Trusted Publisher 校验依据的身份字段，不打印 token 本身
        continue-on-error: true
        run: |
          ID_TOKEN=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | jq -r '.value' 2>/dev/null || true)
          echo "id token acquired: ${ID_TOKEN:+yes}"
          if [ -n "$ID_TOKEN" ]; then
            P=$(printf '%s' "$ID_TOKEN" | cut -d. -f2 | tr '_-' '/+')
            case $(( ${#P} % 4 )) in
              2) P="${P}==" ;;
              3) P="${P}=" ;;
            esac
            printf '%s' "$P" | base64 -d | \
              jq '{sub, repository, repository_owner, job_workflow_ref, ref, event_name, aud, runner_environment}'
          fi
      - name: Publish to npmjs
        run: |
          # 走 npm Trusted Publishing / OIDC：不再依赖长期 npm token，
          # npm CLI 会用 GitHub Actions 的 OIDC ID token 自动换取短期发布凭证。
          # 幂等：版本已存在于 npmjs 时跳过（如 workflow_dispatch 补发 GitHub Packages 场景）
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view gongwen-skill@${PKG_VERSION} version >/dev/null 2>&1; then
            echo "gongwen-skill@${PKG_VERSION} 已存在于 npmjs，跳过"
          else
            npm publish --access public
          fi
      - name: Publish to GitHub Packages
        run: |
          # GitHub Packages npm registry 只支持 scoped 包（官方规则）：
          # 包名必须为 @owner/name 格式。临时改写包名为 @linhut/gongwen-skill 后再发布，
          # 不影响已完成的 npmjs 步骤（npmjs 用原名 gongwen-skill）。
          npm pkg set name="@linhut/gongwen-skill"
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          npm publish --registry=https://npm.pkg.github.com --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, doctor]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Release (编号 = tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: gongwen-skill ${{ github.ref_name }}
          generate_release_notes: true
