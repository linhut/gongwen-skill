name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=gongwen --cov=engine --cov-report=term-missing --cov-fail-under=50

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install lint tools
        run: pip install pycodestyle
      - name: Check Python style
        run: pycodestyle --max-line-length=120 --exclude=__pycache__,.git,dist,build .

  publish:
    name: Publish to PyPI
    needs: [test, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC trusted publishing (PEP 539 / 740)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # OIDC trusted publishing: 不再使用 PYPI_API_TOKEN
        # 需在 https://pypi.org/manage/account/publishing/ 配置 GitHub trusted publisher:
        #   owner: linhut, repo: gongwen-skill, workflow: ci.yml, env: (空)
